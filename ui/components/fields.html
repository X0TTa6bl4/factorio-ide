<div class="fl-panel">
  <div class="fl-panel__head"><h3>Параметры схемы</h3><span class="fl-badge">Форма</span></div>
  <div class="fl-panel__body fl-stack">
    <label class="fl-field">Название<input class="fl-input" type="text" value="Контроль переполнения" autocomplete="off"><span class="fl-field__hint">Отображается в списке проектов.</span></label>
    <div class="fl-field"><span id="profile-label">Профиль</span><div class="fl-selectbox" data-select data-value="base"><button type="button" class="fl-selectbox__control" aria-haspopup="listbox" aria-expanded="false" aria-controls="profile-list" aria-labelledby="profile-label profile-value"><span class="fl-selectbox__value" id="profile-value">Base</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><input type="hidden" data-select-value value="base"><div class="fl-selectbox__popover" popover="manual"><div class="fl-selectbox__list" id="profile-list" role="listbox" aria-labelledby="profile-label"><div role="option" data-value="base" aria-selected="true">Base</div><div role="option" data-value="space-age" aria-selected="false">Space Age</div></div><p class="fl-selectbox__empty" hidden>Ничего не найдено</p></div></div></div>
    <label class="fl-field">Значение сигнала<input class="fl-input fl-mono" type="number" value="5" min="-2147483648" max="2147483647" step="1"><span class="fl-field__hint">Целое число int32.</span></label>
    <label class="fl-field">Пример ошибки<input class="fl-input fl-mono" type="text" value="green_" aria-invalid="true" aria-describedby="field-error"><span class="fl-error" id="field-error">Укажите полное имя сети, например green_buffer.</span></label>
    <label class="fl-check"><input type="checkbox" checked>Комбинатор включён</label>
  </div>
</div>
