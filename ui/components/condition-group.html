<section class="fl-panel" aria-labelledby="condition-title">
  <div class="fl-panel__head"><h3 id="condition-title">Условия сравнивающего</h3><span class="fl-badge">AND / OR</span></div>
  <div class="fl-panel__body fl-stack">
    <div class="fl-panel fl-panel__body fl-stack">
      <div class="fl-row"><span class="fl-signal"><span class="fl-signal__icon" aria-hidden="true">Fe</span>Железо</span><div class="fl-selectbox fl-selectbox--compact" data-select data-value="gt"><span class="fl-sr" id="op1-label">Оператор первого условия</span><button type="button" class="fl-selectbox__control" aria-haspopup="listbox" aria-expanded="false" aria-controls="op1-list" aria-labelledby="op1-label op1-value"><span class="fl-selectbox__value" id="op1-value">&gt;</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><input type="hidden" data-select-value value="gt"><div class="fl-selectbox__popover" popover="manual"><div class="fl-selectbox__list" id="op1-list" role="listbox" aria-labelledby="op1-label"><div role="option" data-value="gt" aria-selected="true">&gt;</div><div role="option" data-value="eq" aria-selected="false">=</div><div role="option" data-value="lt" aria-selected="false">&lt;</div></div><p class="fl-selectbox__empty" hidden>Ничего не найдено</p></div></div><label><span class="fl-sr">Порог железа</span><input class="fl-input fl-mono" style="width: 85px" type="number" value="100" min="-2147483648" max="2147483647" step="1"></label></div>

      <div class="fl-row"><span class="fl-signal fl-signal--copper"><span class="fl-signal__icon" aria-hidden="true">Cu</span>Медь</span><div class="fl-selectbox fl-selectbox--compact" data-select data-value="lt"><span class="fl-sr" id="op2-label">Оператор второго условия</span><button type="button" class="fl-selectbox__control" aria-haspopup="listbox" aria-expanded="false" aria-controls="op2-list" aria-labelledby="op2-label op2-value"><span class="fl-selectbox__value" id="op2-value">&lt;</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><input type="hidden" data-select-value value="lt"><div class="fl-selectbox__popover" popover="manual"><div class="fl-selectbox__list" id="op2-list" role="listbox" aria-labelledby="op2-label"><div role="option" data-value="lt" aria-selected="true">&lt;</div><div role="option" data-value="eq" aria-selected="false">=</div><div role="option" data-value="gt" aria-selected="false">&gt;</div></div><p class="fl-selectbox__empty" hidden>Ничего не найдено</p></div></div><label><span class="fl-sr">Порог меди</span><input class="fl-input fl-mono" style="width: 85px" type="number" value="50" min="-2147483648" max="2147483647" step="1"></label></div>
