<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a18">
  <title>f logic — редактор</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../ui/styles/tokens.css">
  <link rel="stylesheet" href="../../ui/styles/components.css">
  <link rel="stylesheet" href="../../ui/styles/layout.css">
</head>
<body>
  <a class="fl-skip" href="#main">Перейти к содержимому</a>
  <header class="fl-topbar">
    <a class="fl-brand" href="../../index.html"><span class="fl-brand__mark" aria-hidden="true">ƒ.</span>f logic</a>
    <h1 class="fl-sr">Редактор</h1>
    <a class="fl-button fl-topbar__docs" href="../docs/index.html">Документация</a>
  </header>
  <main class="fl-screen" id="main">
    <section class="fl-screen__tools" aria-label="Управление симуляцией">
      <div class="fl-toolbar fl-compact-toolbar" id="toolbar" data-playback="paused">
        <div class="fl-toolbar__actions">
          <button class="fl-button fl-button--icon fl-button--primary" type="button" id="play" aria-pressed="false" aria-label="Запустить" title="Запустить">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg>
          </button>
          <button class="fl-button fl-button--icon" type="button" id="step" aria-label="Шаг" title="Шаг">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7ZM19 5v14"/></svg>
          </button>
          <button class="fl-button fl-button--icon" type="button" id="back" aria-label="Шаг назад" title="Шаг назад">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m19 5-10 7 10 7ZM5 5v14"/></svg>
          </button>
          <button class="fl-button fl-button--icon" type="button" id="reset" aria-label="Сброс" title="Сброс">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 0 5M4 4v6h6"/></svg>
          </button>
        </div>
        <span class="fl-sr" id="speed-label">Скорость</span>
        <div class="fl-selectbox fl-selectbox--compact" id="speed" data-select data-label-id="speed-label" data-menu-title="Скорость" data-menu-width="144" data-value="1" data-options="1:1 тик/с|2:2 тик/с|4:4 тик/с|10:10 тик/с" data-value-only></div>
        <span class="fl-sr" id="tick-name">Текущий тик</span>
        <output class="fl-compact-tick" id="tick-value" aria-labelledby="tick-name tick-value" data-current="false">—</output>
        <span class="fl-sr" id="playback-status" role="status">Приостановлено</span>
      </div>
    </section>

    <div class="fl-screen__stage">
      <section class="fl-panel fl-workbench" data-workbench aria-label="Рабочая область редактора">
        <div class="fl-panel__head">
          <div class="fl-work-views">
            <div role="group" aria-label="Рабочие панели">
              <button class="fl-button fl-button--quiet" type="button" data-work-view="code" aria-expanded="true" aria-controls="code-panel">Код</button>
              <button class="fl-button fl-button--quiet" type="button" data-work-view="networks" aria-expanded="true" aria-controls="networks-column">Сети</button>
            </div>
            <a class="fl-button fl-button--quiet fl-work-link" id="open-events" href="../event/index.html" title="Отдельная страница событийных комбинаторов. Общего прогона с этой схемой нет.">События</a>
          </div>
          <div class="fl-work-doc" role="group" aria-label="Действия документа">
            <button class="fl-button" type="button" id="new-draft">Новый черновик</button>
          </div>
          <div class="fl-work-edit" role="group" aria-label="Редактирование кода">
            <span class="fl-tip" data-tooltip>
              <button class="fl-button fl-button--icon" type="button" id="undo" aria-label="Отменить правку" aria-describedby="undo-tip" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8.5 7.5 4 12l4.5 4.5"/><path d="M4 12h9c3.5 0 6 2.2 6 5.2S16.5 22 13 22H10"/></svg></button>
              <span class="fl-tooltip" id="undo-tip" role="tooltip">Отменить правку · Ctrl+Z</span>
            </span>
            <span class="fl-tip" data-tooltip>
              <button class="fl-button fl-button--icon" type="button" id="redo" aria-label="Повторить правку" aria-describedby="redo-tip" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15.5 7.5 4.5 4.5-4.5 4.5"/><path d="M20 12h-9c-3.5 0-6 2.2-6 5.2S7.5 22 11 22h3"/></svg></button>
              <span class="fl-tooltip" id="redo-tip" role="tooltip">Повторить правку · Ctrl+Y</span>
            </span>
          </div>
        </div>
        <div class="fl-editor-stage">
          <section class="fl-panel" id="code-panel" aria-labelledby="document-title">
            <h2 id="document-title" class="fl-sr">Код</h2>
            <label class="fl-sr" for="document">Текст конфигурации схемы</label>
            <div class="fl-editor">
              <div class="fl-editor__gutter" id="gutter" aria-hidden="true">01</div>
              <textarea id="document" class="fl-textarea" wrap="off" spellcheck="false" autocomplete="off"></textarea>
            </div>
            <div class="fl-editor__status" id="editor-status" data-kind="ok">
              <p id="document-state" class="fl-editor__status-text">Код проверен</p>
              <button class="fl-button fl-button--quiet" type="button" id="status-jump" hidden>К месту</button>
              <button class="fl-button fl-button--quiet" type="button" id="status-list" hidden aria-expanded="false" aria-controls="diagnostics">Список</button>
              <div id="diagnostics" class="fl-editor__diagnostics" hidden></div>
              <div id="document-live" class="fl-sr" aria-live="polite" aria-atomic="true"></div>
            </div>
          </section>
          <aside class="fl-editor-inspector" id="networks-column" aria-label="Сети и настройки">
            <section class="fl-panel" id="signal-panel" data-run="none" aria-labelledby="signals-title">
              <div class="fl-panel__head"><h2 id="signals-title">Сети</h2></div>
              <div class="fl-panel__body fl-stack">
                <label class="fl-field">Фильтр
                  <input class="fl-input" id="signal-filter" type="text" autocomplete="off" spellcheck="false" placeholder="Сеть или сигнал">
                </label>
                <p class="fl-field__hint" id="stale-note" hidden></p>
                <div class="fl-table-wrap fl-signal-scroll" id="signal-scroll" tabindex="0" role="region" aria-label="Сигналы сетей">
                  <table class="fl-table">
                    <caption class="fl-sr">Сигналы по сетям: имя, цвет и значение</caption>
                    <thead><tr><th scope="col">Сеть</th><th scope="col">Сигнал</th><th scope="col">Значение</th></tr></thead>
                    <tbody id="live-signals"></tbody>
                  </table>
                </div>
              </div>
            </section>
          </aside>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="../../ui/scripts/widgets.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
